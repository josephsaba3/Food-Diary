<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafbf9">
  <meta name="robots" content="noindex, nofollow">
  <meta name="csrf-token" content="{{ csrf }}">
  <title>{% block title %}Food diary{% endblock %}</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a href="#main" class="skip-link">Skip to diary</a>
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="Food diary home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a3 3 0 0 1-3-3V4a1 1 0 0 1 1-1Z"/><path d="M4 17h15M9 3v10m4-6h3m-3 4h3"/></svg>Food diary<span class="wordmark-dot" aria-hidden="true">.</span></a>
    {% block header_actions %}{% endblock %}
  </header>
  {% block content %}{% endblock %}
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
