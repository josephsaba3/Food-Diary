{% extends "base.html" %}
{% block title %}Sign in · Food diary{% endblock %}
{% block content %}
<main id="main" class="auth-page">
  <h1>Your daily diary.</h1>
  <p class="lede">A little space for what you ate<br>and how you felt.</p>
  <form method="post" action="/login" class="auth-form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="password">Diary password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}>
    {% if error %}<p class="error" id="login-error" role="alert">{{ error }}</p>{% endif %}
    <button class="button primary full" type="submit">Open my diary <span aria-hidden="true">→</span></button>
  </form>
  <p class="muted small">Your meals. Your notes. Just for you.</p>
</main>
{% endblock %}
