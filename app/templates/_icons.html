{# Line icons, 24px grid, drawn with currentColor. #}
{% macro icon(name, size=22) -%}
<svg class="i" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
{%- if name == 'today' %}<rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8 9h8M8 13h5"/>
{%- elif name == 'week' %}<path d="M4 6h16M4 12h16M4 18h10"/>
{%- elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{%- elif name == 'health' %}<path d="M3 12h4l2-5 4 10 2-5h6"/>
{%- elif name == 'report' %}<path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>
{%- elif name == 'calendar' %}<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>
{%- elif name == 'settings' %}<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4.4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2l.4 2.6h4.4l.4-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/>
{%- elif name == 'more' %}<circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/>
{%- elif name == 'close' %}<path d="m6 6 12 12M18 6 6 18"/>
{%- elif name == 'clock' %}<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
{%- elif name == 'sync' %}<path d="M20 11a8 8 0 0 0-14.9-3M4 13a8 8 0 0 0 14.9 3M5 3v5h5m9 13v-5h-5"/>
{%- elif name == 'repeat' %}<path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 0 1-13.7 5.6L4 15.5M4 20v-4.5h4.5"/>
{%- elif name == 'note' %}<path d="M6 4h12v16H6z"/><path d="M9 9h6M9 13h6"/>
{%- elif name == 'info' %}<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/>
{%- elif name == 'drop' %}<path d="M12 3.5c3 3.6 5.5 6.9 5.5 10a5.5 5.5 0 0 1-11 0c0-3.1 2.5-6.4 5.5-10Z"/>
{%- elif name == 'minus' %}<path d="M5 12h14"/>
{%- elif name == 'pulse' %}<path d="M3 12h4l2-5 4 10 2-5h6"/>
{%- elif name == 'left' %}<path d="m14 6-6 6 6 6"/>
{%- elif name == 'right' %}<path d="m10 6 6 6-6 6"/>
{%- elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{%- elif name == 'print' %}<path d="M7 9V4h10v5M7 17H5a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2"/><path d="M7 14h10v6H7z"/>
{%- endif -%}
</svg>
{%- endmacro %}
